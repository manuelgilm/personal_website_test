name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      NODE_VERSION: "22"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_OCEAN_06863000F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "." # App source code path
          api_location: "./api" # Api source code path - optional
          output_location: "dist" # Astro build output
          # Optional analytics: set PUBLIC_GA4_ID / PUBLIC_PLAUSIBLE_DOMAIN as
          # repository variables. Empty values build with no analytics script.
          app_build_command: "PUBLIC_GA4_ID='${{ vars.PUBLIC_GA4_ID }}' PUBLIC_PLAUSIBLE_DOMAIN='${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}' npm run build"
          ###### End of Repository/Build Configurations ######

      - name: Submit URLs to IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: node scripts/indexnow.mjs
        env:
          SITEMAP_URL: https://gilmanuel.com/sitemap-0.xml

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_OCEAN_06863000F }}
          action: "close"
